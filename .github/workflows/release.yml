name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write  # needed to create releases and push tags
  issues: write
  pull-requests: write

jobs:
  # ── 1. Semantic release ─────────────────────────────────────────────────────
  semantic-release:
    name: Semantic release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history needed for semantic-release

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. macOS Apple Silicon + Windows x64 builds ─────────────────────────────
  build:
    name: Build
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.semantic-release.outputs.version }}

  # ── 3. Attach the packages to the GitHub release ────────────────────────────
  publish:
    name: Upload release assets
    needs: [semantic-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.semantic-release.outputs.version }}
          files: |
            dist/img-settings-macos-arm64.dmg
            dist/img-settings-windows-x64.zip
          fail_on_unmatched_files: true
